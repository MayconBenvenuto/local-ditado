[package]
name = "local-ditado-app"
version = "0.2.0"
description = "Local Ditado desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "local_ditado_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
