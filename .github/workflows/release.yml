name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libportaudio2

      - name: Install engine + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[app,vad]" pyinstaller

      - name: Build sidecar
        working-directory: app
        run: python build-sidecar.py

      - name: Install app deps + icons
        working-directory: app
        run: |
          npm install
          npx tauri icon src-tauri/icons/icon.png

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-ditado-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
